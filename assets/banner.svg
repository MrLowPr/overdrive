<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="overdrive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1090" cy="120" r="220" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="1180" cy="520" r="180" fill="#a78bfa" fill-opacity="0.12"/>
  <rect x="96" y="236" width="96" height="8" rx="4" fill="url(#accent)"/>
  <text x="96" y="332" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">overdrive</text>
  <text x="96" y="396" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">Overdrive, a PS5 homebrew game store with 1,800+ games.</text>
  <text x="96" y="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">github.com/MrLowPr/overdrive</text>
</svg>
